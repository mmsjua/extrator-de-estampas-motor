<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extrator de Estampas - Teste</title><style>body{font:16px system-ui;max-width:850px;margin:auto;padding:24px;background:#101827;color:white}button,input{padding:12px;margin:8px}canvas{max-width:100%;background:white}section{padding:16px;background:#243044;border-radius:12px}</style><h1>Extrator de Estampas — Teste online</h1><p>Protótipo: separação aproximada por cores, sem IA. Não reconstrói fundos nem identifica logos ou textos.</p><section><input id="file" type="file" accept="image/*"><label>Cores <input id="n" type="number" min="2" max="8" value="5"></label><button id="run">Separar e exportar</button><p id="status">Carregue uma foto.</p><canvas id="preview"></canvas></section><div id="results"></div><script>
const el=x=>document.getElementById(x),c=el('preview'),ctx=c.getContext('2d',{willReadFrequently:true});let ready=false;
el('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let im=new Image();im.onload=()=>{let s=Math.min(1,700/im.width,700/im.height);c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);ctx.drawImage(im,0,0,c.width,c.height);ready=true;el('status').textContent='Imagem carregada';URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)};
function save(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
el('run').onclick=()=>{if(!ready)return alert('Carregue uma imagem.');let w=c.width,h=c.height,n=Math.max(2,Math.min(8,+el('n').value||5)),data=ctx.getImageData(0,0,w,h).data,centers=[];for(let j=0;j<n;j++){let i=Math.floor((j+.5)*w*h/n)*4;centers.push([data[i],data[i+1],data[i+2]])}let labels=new Uint8Array(w*h);for(let t=0;t<6;t++){let sums=Array.from({length:n},()=>[0,0,0,0]);for(let p=0;p<w*h;p++){let i=p*4,b=Infinity,k=0;for(let j=0;j<n;j++){let d=centers[j].reduce((s,v,q)=>s+(data[i+q]-v)**2,0);if(d<b){b=d;k=j}}labels[p]=k;for(let q=0;q<3;q++)sums[k][q]+=data[i+q];sums[k][3]++}for(let j=0;j<n;j++)if(sums[j][3])centers[j]=sums[j].slice(0,3).map(v=>Math.round(v/sums[j][3]))}el('results').innerHTML='<h2>Camadas</h2>';for(let j=0;j<n;j++){let layer=document.createElement('canvas');layer.width=w;layer.height=h;let x=layer.getContext('2d'),im=x.createImageData(w,h),paths=[];for(let y=0;y<h;y++)for(let a=0;a<w;){if(labels[y*w+a]!==j){a++;continue}let start=a;while(a<w&&labels[y*w+a]===j){let p=(y*w+a)*4;for(let q=0;q<3;q++)im.data[p+q]=data[p+q];im.data[p+3]=255;a++}paths.push('M'+start+' '+y+'h'+(a-start)+'v1h-'+(a-start)+'z')}x.putImageData(im,0,0);let div=document.createElement('section');div.innerHTML='<h3>Camada '+(j+1)+'</h3>';let png=document.createElement('button');png.textContent='Baixar PNG';png.onclick=()=>layer.toBlob(b=>save(b,'camada_'+(j+1)+'.png'));let svg=document.createElement('button');svg.textContent='Baixar SVG aproximado';svg.onclick=()=>{let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'"><g fill="rgb('+centers[j].join(',')+')"><path d="'+paths.join(' ')+'"/></g></svg>';save(new Blob([s],{type:'image/svg+xml'}),'camada_'+(j+1)+'.svg')};div.append(png,svg,layer);el('results').append(div)}el('status').textContent=n+' camadas geradas.'};
</script></html>
