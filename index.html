<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extrator de Estampas — Novo Teste</title><style>body{background:#101827;color:#fff;font:16px system-ui;margin:0}main{max-width:700px;margin:35px auto;padding:22px;background:#1e293b;border-radius:16px}button,input,select{padding:12px;margin:10px 0}button{background:#5eead4;border:0;border-radius:8px;font-weight:bold}img{max-width:100%;max-height:320px}p{line-height:1.5}</style><main><h1>Extrator de Estampas — Novo Teste</h1><p>Teste gratuito de extração de arte da camisa e exportação PNG + SVG.</p><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><p><img id="preview"></p><label>Modo: <select id="mode"><option value="/extract-shirt-design">Extrair estampa da camisa (experimental)</option><option value="/vectorize-package">Vetorizar PNG transparente (PNG + SVG)</option><option value="/extract-blocks">Separar elementos de PNG transparente</option></select></label><p><button id="go">Processar e baixar ZIP</button></p><p id="status">Selecione a imagem.</p><small>O modo de camisa usa diferença de cor, não IA treinada. Pode incluir tecido ou perder detalhes; não garante qualidade de impressão.</small></main><script>const file=document.getElementById("file"),preview=document.getElementById("preview"),go=document.getElementById("go"),status=document.getElementById("status"),mode=document.getElementById("mode");file.onchange=()=>{if(file.files[0])preview.src=URL.createObjectURL(file.files[0])};go.onclick=async()=>{if(!file.files[0])return;go.disabled=true;status.textContent="Processando...";try{let f=new FormData();f.append("file",file.files[0]);let r=await fetch(mode.value,{method:"POST",body:f});if(!r.ok)throw Error((await r.json()).detail||"Falha");let u=URL.createObjectURL(await r.blob());let a=document.createElement("a");a.href=u;a.download="extracao_teste.zip";a.click();status.textContent="Arquivo ZIP gerado";setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){status.textContent="Erro: "+e.message}finally{go.disabled=false}};</script></html>
