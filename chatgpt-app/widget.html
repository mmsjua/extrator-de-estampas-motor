<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:light dark}body{margin:0;padding:12px}.panel{border:1px solid #8885;border-radius:16px;padding:16px;max-width:560px;margin:auto}h2{margin:0 0 6px;font-size:20px}p{font-size:12px;color:#888}input{max-width:100%;margin:10px 0}canvas{display:block;max-width:100%;border:1px dashed #8888;touch-action:none;cursor:crosshair}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}button{padding:12px 7px;border-radius:10px;border:1px solid #8887;background:transparent;color:inherit;font-size:12px;font-weight:650;cursor:pointer}button:hover{background:#8882}button:disabled{opacity:.4}#status{font-size:12px;white-space:pre-wrap}a{display:inline-block;margin-top:12px}
</style></head><body><div class="panel"><h2>Extrator de Estampas</h2><p>Envie a camisa. Para recortar uma área, arraste o mouse sobre a imagem. Clique na função desejada.</p><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><canvas id="canvas" width="520" height="300"></canvas><div class="grid" id="grid"></div><div id="status" role="status">Aguardando imagem.</div><a id="download" hidden>Baixar PNG</a><p>Versão experimental: recorte PNG e remoção de branco. Extração inteligente e reconstrução por IA ainda não disponíveis.</p></div>
<script>
const ops=[["fundo","EXTRAIR FUNDO"],["logo","EXTRAIR LOGO"],["frente","EXTRAIR FRENTE"],["costas","EXTRAIR COSTAS"],["fundo_logo","FUNDO + LOGO"],["textos_artes","TEXTOS + ARTES"],["mangas","EXTRAIR MANGAS"],["nova_imagem","NOVA IMAGEM"],["selecionar_area","SELECIONAR ÁREA"]];
const file=document.querySelector("#file"),canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d"),status=document.querySelector("#status"),download=document.querySelector("#download");
let data="",img=null,rect=null,start=null;
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(img)ctx.drawImage(img,0,0,canvas.width,canvas.height);if(rect){ctx.strokeStyle="#00b5ff";ctx.lineWidth=3;ctx.strokeRect(rect.x*canvas.width,rect.y*canvas.height,rect.w*canvas.width,rect.h*canvas.height)}}
file.onchange=()=>{const f=file.files[0];if(!f)return;if(f.size>7000000){status.textContent="Imagem maior que 7 MB.";return}const reader=new FileReader();reader.onload=()=>{data=reader.result;img=new Image();img.onload=()=>{canvas.height=Math.round(canvas.width*img.height/img.width);rect=null;draw();status.textContent="Imagem carregada. Escolha uma função.";download.hidden=true};img.src=data};reader.readAsDataURL(f)};
function point(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
canvas.onpointerdown=e=>{if(!img)return;start=point(e);canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!start)return;const p=point(e);rect={x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),w:Math.abs(start.x-p.x),h:Math.abs(start.y-p.y)};draw()};
canvas.onpointerup=()=>{start=null;if(rect&&(rect.w<.005||rect.h<.005))rect=null;draw()};
for(const [id,label] of ops){const b=document.createElement("button");b.textContent=label;b.onclick=async()=>{if(id==="nova_imagem"){file.click();return}if(!data){status.textContent="Envie a imagem da camisa primeiro.";return}if(!window.openai?.callTool){status.textContent="Abra o painel no aplicativo conectado ao ChatGPT.";return}b.disabled=true;download.hidden=true;status.textContent="Processando "+label+"...";try{const response=await window.openai.callTool("processar_estampa",{operacao:id,imagem_base64:data,area:rect||undefined});const obj=response?.structuredContent||response?.result?.structuredContent;if(!obj?.ok)throw Error(obj?.error||"Não foi possível gerar o PNG.");download.href="data:image/png;base64,"+obj.png_base64;download.download=obj.filename;download.textContent="Baixar "+obj.filename;download.hidden=false;status.textContent=obj.notice||"PNG pronto."}catch(e){status.textContent="Erro: "+e.message}finally{b.disabled=false}};document.querySelector("#grid").append(b)}
</script></body></html>
